<!DOCTYPE html>

<html lang="id"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Perkenalan</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdf6ec;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: #fffaf3;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
            
            /* animasi muncul */
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            color: #6b4f3b;
            animation: slideDown 1s ease;
        }

        p {
            font-size: 18px;
            color: #5a4633;
        }

        img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        /* efek hover gambar */
        img:hover {
            transform: scale(1.05);
        }

        /* animasi fade */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* animasi judul */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>

<body>

<div class="container">
    
    <h1>Hallo Semuanya!</h1>
    <p>Ini adalah kumpulan contoh latihan dan tugas.</p>
